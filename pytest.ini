[pytest]
# ⛔ tests/ и src/ в пути: тесты импортируют helpers по имени и sanitizer как пакет,
#    без __init__.py в каталогах тестов (правило пяти записей в папке).
pythonpath = tests src
testpaths = tests
addopts = -ra --strict-markers
markers =
    db: требует поднятого стенда MySQL (demo/sakila, docker compose up -d)
    slow: делает собственную копию базы под один тест
filterwarnings =
    error::DeprecationWarning
