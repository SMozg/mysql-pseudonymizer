# Пример конфига санитайзера -- скопировать в config.yaml и подставить свои значения.
# Тот же состав, что и в боевом файле (КОНТРАКТ.md §4): stand · run · providers · paths.
# ⛔ Секретов здесь нет и быть не может: пароль стенда и оба ключа -- ТОЛЬКО из окружения.
#   MYSQL_USER / MYSQL_PASSWORD (или MYSQL_ROOT_PASSWORD для root-доступа) -- пароль стенда.
#   SANIT_KEY          -- ключ шифрования словаря замен (Р-40/Р-42/Р-72).
#   SANIT_MODEL_KEY    -- ключ доступа к языковой модели.
#   Шаблон переменных окружения -- .env.example рядом с этим файлом (в корне репозитория).

stand:
  host: <хост MySQL, например 127.0.0.1>
  port: <порт MySQL, например 3306>
  user: <пользователь MySQL -- НЕ пароль, он в окружении>
  source_schema: <исходная схема -- ⛔ только чтение, санитайзер её не меняет>
  work_schema: <рабочая копия -- её и чистит прогон>
  ref_schema: <схема снимка «ДО» -- эталон сравнений блока И>
  restored_schema: <схема-приёмник обратного прогона, команда reverse>

run:
  seed: <целое число -- хозяин seed только у раннера; один seed = один воспроизводимый прогон>
  batch_size: <размер пакета к языковой модели, например 50 -- один вызов на N значений класса>
  retry_limit: 3              # ⛔ контракт: 3 повтора = 4 попытки на значение, не менять без решения
  refusal_ratio: 0.05          # ⛔ контракт: потолок отказов 5 % от принятых заявок
  country_frame_margin: <запас страновой рамки координаты, в градусах, например 0.05>
  declaration: <"base" -- прогон на свежей копии, "continue" -- продолжение после обрыва>
  model_name: <имя модели у поставщика litellm, например claude-3-5-haiku-20241022 -- самая
                дешёвая модель линейки Claude; имя может быть любым, включая модели других
                поставщиков (сторонний OpenAI-совместимый шлюз -- переменная окружения
                SANIT_MODEL_BASE_URL, см. .env.example / README.md); ключ модели и адрес
                шлюза сюда НЕ попадают>

providers:
  # ⛔ Р-81: какой поставщик обслуживает какой класс значений -- решение архитектуры,
  # менять только вместе с ним. "model" -- живая модель (сеть, ключ); "generator" --
  # детерминированный генератор (без сети); "nontext" -- индекс/телефон/координата.
  "КЗ-1": model
  "КЗ-2": model
  "КЗ-3": model
  "КЗ-4": generator
  "КЗ-5": generator
  "КЗ-6": nontext
  "КЗ-7": nontext
  "КЗ-8": nontext

paths:
  fieldmap: config/fieldmap.yaml
  # ⛔ Пути ниже -- ВНЕ репозитория по построению (см. .gitignore): словарь -- деанонимизатор,
  # журнал и отчёт -- местные артефакты конкретного прогона, публиковать их не нужно.
  dictionary: <путь к файлу словаря, например runs/dict.enc>
  runlog: <путь к журналу прогона, например runlog/run.runlog>
  report: <путь к отчёту приёмки, например report/ОТЧЕТ-ПРИЕМКИ.md>
  snapshot_before: <путь к снимку «ДО», например runs/snapshot_before.json>
  snapshot_after: <путь к снимку «ПОСЛЕ», например runs/snapshot_after.json>
