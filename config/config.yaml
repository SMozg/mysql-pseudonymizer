# Боевой конфиг санитайзера -- по нему завтра идёт настоящий прогон на демо-стенде
# Sakila (см. README, demo/sakila). ⛔ Секретов здесь нет ни одного: пароль стенда
# (MYSQL_USER/MYSQL_PASSWORD/MYSQL_ROOT_PASSWORD), ключ словаря (SANIT_KEY) и ключ
# модели (SANIT_MODEL_KEY) читаются ТОЛЬКО из окружения (см. demo/sakila/.env и
# корневой .env, шаблон -- .env.example).

stand:
  host: 127.0.0.1
  # ⛔ Порт и пользователь берутся ИЗ ОКРУЖЕНИЯ (demo/sakila/.env, оно же читается
  # docker compose при подъёме стенда): одно значение, один источник. Занят 3307 --
  # правится ОДНА строка в .env, конфиг не трогается. Пустая переменная -- гейт (код 3).
  port: ${MYSQL_HOST_PORT}
  user: ${MYSQL_USER}
  source_schema: sakila        # ⛔ только чтение, критерий 22 стережёт неизменность
  work_schema: sanit_work      # рабочая копия -- её чистит прогон
  ref_schema: sanit_ref        # снимок «ДО», эталон сравнений
  restored_schema: sanit_restored   # приёмник обратного прогона (критерий 28)

run:
  # ⛔ Значения ниже, где контракт молчал, выбраны мной осознанно -- см. отчёт волны:
  seed: 20260903               # дата снятия эталонных чисел (tests/helpers/reference.py) --
                                # тот же seed, под который проверены все контрольные числа
  batch_size: 1000              # 📌 решение владельца 07.09. Замерено: строка стоит ≈13
                                 # токенов на входе и ≈9 на выходе, значит 200 строк это
                                 # 1,3 % контекста Haiku — упираемся не в контекст, а в
                                 # способность модели удержать инструкцию на длинном ответе.
                                 # ⛔ Главный выигрыш не в числе вызовов: 1000 больше любого
                                 # класса этой базы (имён 591, фамилий 599, городов 599),
                                 # поэтому КАЖДЫЙ класс уходит ОДНИМ запросом. Швов между
                                 # пакетами не остаётся вовсе, и правило «все замены в ответе
                                 # разные» работает сразу на весь класс — межпакетные повторы
                                 # исчезают не потому, что мы их гасим, а потому, что пакет один.
  temperature: 0.7               # 📌 решение владельца 07.09, ЗАМЕРЕНО тремя точками:
                                 #   0    — эха 0, разнообразие 42 %
                                 #   0.7  — эха 0, разнообразие 68 %   ← выбрано
                                 #   1.0  — эхо непредсказуемо: 14, потом 529, потом 558 из 600
                                 # ⛔ На 1.0 модель, не вытягивая задачу, удовлетворяет требование
                                 # различности самым дешёвым способом — переписывает вход. Правило
                                 # практики: брать МИНИМАЛЬНУЮ температуру, при которой хватает
                                 # разнообразия, и находить её замером, а не вкусом.
  retry_limit: 4                 # 📌 решение владельца 07.09: 4 повтора = 5 попыток на значение.
                                 # Было 3. Замерено: фамилии сходятся 58 → 6 за один заход,
                                 # то есть запас нужен, а разброс температуры 1.0 у нас был
                                 # девятикратным. ⛔ Потолок остаётся ЗАЩИТОЙ, а не формальностью:
                                 # он ловит поставщика, который не может выдать годное значение,
                                 # и поднимать его дальше значит узнавать о болезни позже.
  refusal_ratio: 0.05            # ⛔ контракт: потолок отказов 5 % от принятых (138 при 2771)
  country_frame_margin: 0.05     # запас страновой рамки координаты (КЗ-8), в градусах
  declaration: base              # ⛔ первый прогон на свежей копии -- "база исходная";
                                  # на продолжении после обрыва сменить на continue руками
  model_name: claude-haiku-4-5-20251001   # быстрая дешёвая модель; ⛔ имя любое, поставщик
                                 # задаётся адресом шлюза в SANIT_MODEL_BASE_URL (окружение);
                                # имя может быть любым, включая модели других поставщиков --
                                # см. SANIT_MODEL_BASE_URL в .env.example / README.md

providers:
  # ⛔ Р-81: живая модель -- только имя/фамилия/город; район и адрес -- генератор;
  # индекс/телефон/координата -- нетекстовый поставщик (сети не требует).
  "КЗ-1": model
  "КЗ-2": model
  "КЗ-3": model
  "КЗ-4": generator
  "КЗ-5": generator
  "КЗ-6": nontext
  "КЗ-7": nontext
  "КЗ-8": nontext

paths:
  fieldmap: config/fieldmap.yaml
  # ⛔ Ниже -- ВНЕ репозитория по построению: .gitignore отсекает *.enc, runs/,
  # runlog/, report/ как деанонимизаторы (словарь) и как местные артефакты прогона.
  dictionary: runs/dict.enc
  runlog: runlog/run.runlog
  report: report/ОТЧЕТ-ПРИЕМКИ.md
  snapshot_before: runs/snapshot_before.json
  snapshot_after: runs/snapshot_after.json
