[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanitizer"
version = "0.1.0"
description = "Обезличивание тестового MySQL-стенда (карта блоков А...К)"
requires-python = ">=3.12"
dependencies = [
    "PyMySQL>=1.1",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "litellm>=1.99",
    "phonenumbers>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
