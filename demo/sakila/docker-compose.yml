# Демо-стенд Sakila для инструмента санитизации.
# Подъём:   docker compose -f <этот файл> up -d
# Проверка: docker compose -f <этот файл> ps
# Снос:     docker compose -f <этот файл> down -v

# ⛔ Имя проекта задано ЯВНО. Без этой строки compose берёт его из имени каталога,
# в котором лежит файл, -- то есть "sakila". Любой другой стенд, поднятый из
# каталога с тем же именем (а так называется каталог демо-базы у кого угодно),
# попадает в ТОТ ЖЕ проект: compose считает чужой контейнер своим и пересоздаёт
# его, а том данных `<проект>_sakila-data` оказывается общим -- две разные базы
# делят один диск. Поймано при проверке запуска из чистого клона 2026-09-06:
# подъём демо-стенда пересоздал соседний, ничем не связанный контейнер MySQL.
name: sanitizer-sakila

services:
  sakila-db:
    image: mysql:8.0.43
    container_name: sanitizer-sakila-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --local-infile=0
      # ⛔ Двоичный журнал в MySQL 8 включён по умолчанию, и создание хранимой
      # ФУНКЦИИ под ним требует SUPER — иначе сервер отвечает 1419. Инструмент
      # копирует схему пользователем приложения, без SUPER: три функции Sakila
      # не создались бы, копия схемы оборвалась бы на них. Для одноразового
      # демо-стенда переменная безопасна; на боевом сервере альтернатива —
      # выдать копирующему пользователю SET_USER_ID/SUPER. README называл это
      # требование, а сам стенд его не выполнял — поймано проверкой запуска
      # из чистого клона 2026-09-06.
      - --log-bin-trust-function-creators=1
    ports:
      # только петля, наружу база не торчит
      - "127.0.0.1:${MYSQL_HOST_PORT}:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - sakila-data:/var/lib/mysql
    healthcheck:
      # ⛔ НЕ `mysqladmin ping`: он меряет, что сервер ОТВЕТИЛ, а не что нас
      # пустили. С неверным паролем ping печатает "Access denied" и выходит
      # КОДОМ 0 -- контейнер встаёт `healthy` над сервером, в который ни одна
      # команда инструмента войти не может (замерено независимым судьёй
      # 08.09.2026). Проверка ниже выполняет НАСТОЯЩИЙ запрос под тем же
      # паролем, каким пойдёт санитайзер: не пустили -- не `healthy`.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  sakila-data:
